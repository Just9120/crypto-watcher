name: Release and production delivery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cryptowatcher-production
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'Just9120/crypto-watcher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.impact.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: impact
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            python scripts/impact.py "$BEFORE" "$HEAD" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: select
    if: needs.select.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      # Reuse is not claimed: this validates the exact merged inputs before trusted build.
      - run: uv pip check --python "$(command -v python)"
      - run: python scripts/build_native.py
      - run: python scripts/checks.py all
      - env:
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          docker build --build-arg SOURCE_REVISION="$REVISION" --build-arg BUILD_RUN="$RUN_ID" -t "cryptowatcher:$REVISION" .
          python scripts/image_checks.py "cryptowatcher:$REVISION" "$REVISION"
          python scripts/package_release.py "$REVISION" "$RUN_ID" "cryptowatcher:$REVISION" release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cryptowatcher-${{ github.sha }}-${{ github.run_id }}
          path: |
            release/bundle.tar
            release/bundle.sha256
            release/manifest.json
          retention-days: 90
          if-no-files-found: error
  production:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Bound the entire delivery job
        run: echo "CW_DELIVERY_DEADLINE=$(( $(date +%s) + 870 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download this run's verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: python scripts/download_release.py "$REVISION" "$RUN_ID"
      - name: Deliver only after reviewed first migration and credentials setup
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SSH_KEY: ${{ secrets.CW_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CW_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/cw-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/cw-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/cw-ssh/known_hosts"
          python scripts/deliver_release.py "$REVISION" "$RUN_ID" --ssh-directory "$RUNNER_TEMP/cw-ssh"
      - name: First delivery gate
        if: vars.DEPLOY_ENABLED != 'true'
        run: echo 'Artifact prepared; production delivery PENDING explicit first-migration gate.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && vars.DEPLOY_ENABLED == 'true'
        with:
          name: deployment-${{ github.sha }}-${{ github.run_id }}
          path: release/deployment.json
          retention-days: 90
          if-no-files-found: error
