name: Full main regression without delivery
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full main regression or owner-authorized immutable revision pair
        required: true
        default: full
        type: choice
        options: [full, revision-pair]
      revision:
        description: Exact current main SHA, no branch/tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cryptowatcher-full-validation
  cancel-in-progress: false
jobs:
  full:
    if: github.repository == 'Just9120/crypto-watcher' && github.ref == 'refs/heads/main' && inputs.mode != 'revision-pair'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_REVISION: ${{ inputs.revision }}
      VALIDATION_REPORT: .cache-g1/full-validation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify exact source before dependency setup
        run: |
          python - <<'PY'
          import os,re,subprocess
          revision=os.environ['EXPECTED_REVISION']
          assert re.fullmatch(r'[0-9a-f]{40}',revision)
          for ref in ('HEAD','refs/remotes/origin/main'):
              assert subprocess.check_output(['git','rev-parse',ref],text=True).strip()==revision
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade --require-hashes --only-binary=:all: -r requirements-bootstrap.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: uv pip check --python "$(command -v python)"
      - name: Canonical full profile; never deploy
        run: python scripts/checks.py full --revision "$EXPECTED_REVISION" --report-directory "$VALIDATION_REPORT"
      - name: Preserve small results including failures and skipped cases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VALIDATION_REPORT }}/*.json
            ${{ env.VALIDATION_REPORT }}/*.xml
            ${{ env.VALIDATION_REPORT }}/*.log
            ${{ env.VALIDATION_REPORT }}/package/manifest.json
            ${{ env.VALIDATION_REPORT }}/package/bundle.sha256
          retention-days: 14
          if-no-files-found: warn

  revision-pair:
    if: github.repository == 'Just9120/crypto-watcher' && github.ref == 'refs/heads/codex/sqlite-revision-pair-20261103' && inputs.mode == 'revision-pair' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MEASUREMENT: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      PAIR_REPORT: .cache-g1/revision-pair-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked controller dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Validate measurement identity, limits, rollback and cleanup
        run: |
          mkdir -p .cache-g1
          python -m pytest -q tests/test_revision_pair.py tests/test_cpu_pair.py tests/test_full_validation.py tests/test_processing_qualification.py --basetemp .cache-g1/pair-controller-tests
      - name: Build two exact versions with identical frozen scenario and measurement
        shell: bash
        run: |
          set -euo pipefail
          previous=a5273820ce396ce60efff9856953fdd0a007bb8f
          current=cf638ec4871a275738c25ae7198f6744ab797e20
          mkdir -p "$(dirname "$PAIR_REPORT")"
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          revisions=('a5273820ce396ce60efff9856953fdd0a007bb8f','cf638ec4871a275738c25ae7198f6744ab797e20')
          frozen=('Dockerfile','requirements.txt','requirements-bootstrap.txt','requirements-dev.txt','tests/processing.Dockerfile','tests/processing_replay.py','tests/test_processing_replay.py','scripts/qualify_processing.py','scripts/qualify_framed_backup.py')
          manifests=[]
          for revision in revisions:
              files={path:hashlib.sha256(subprocess.check_output(['git','show',revision+':'+path])).hexdigest() for path in frozen}
              manifests.append({'revision':revision,'tree':subprocess.check_output(['git','rev-parse',revision+'^{tree}'],text=True).strip(),'frozen_files':files})
          assert manifests[0]['frozen_files']==manifests[1]['frozen_files']
          Path(os.environ['PAIR_REPORT']+'-source-manifest.json').write_text(json.dumps({'measurement':os.environ['MEASUREMENT'],'cases':manifests},indent=2))
          PY
          for revision in "$previous" "$current"; do
            source_dir="$RUNNER_TEMP/cw-revision-$revision"
            mkdir "$source_dir"
            git archive "$revision" | tar -x -C "$source_dir"
            docker build --build-arg SOURCE_REVISION="$revision" --build-arg BUILD_RUN="$RUN_ID" -t "cw-pair-app:$revision" "$source_dir"
            docker build -f "$source_dir/tests/processing.Dockerfile" --build-arg BASE_IMAGE="cw-pair-app:$revision" -t "cw-pair-frozen:$revision" "$source_dir"
            docker build -f tests/revision_pair.Dockerfile --build-arg BASE_IMAGE="cw-pair-frozen:$revision" --build-arg MEASUREMENT_REVISION="$MEASUREMENT" -t "cw-revision-pair:$revision" .
          done
      - name: One sequential diagnostic pair; shared unchanged limits and no delivery
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout --signal=INT --kill-after=10s 600s "$(command -v python)" -B -m scripts.qualify_revision_pair run cw-revision-pair:a5273820ce396ce60efff9856953fdd0a007bb8f cw-revision-pair:cf638ec4871a275738c25ae7198f6744ab797e20 "$MEASUREMENT" "$PAIR_REPORT"
      - name: Preserve reports including failures; never fixture databases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: revision-pair-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache-g1/revision-pair-*/*.json
            .cache-g1/revision-pair-*/*.log
            .cache-g1/revision-pair-*-source-manifest.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
