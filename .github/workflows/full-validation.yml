name: Full main regression without delivery
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit owner-authorized profile; never deploy
        type: choice
        options: [full-main, group-publication, counter-delta-pair]
        default: full-main
      revision:
        description: Exact selected source SHA, no branch/tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cryptowatcher-full-validation
  cancel-in-progress: false
jobs:
  full:
    if: github.repository == 'Just9120/crypto-watcher' && github.ref == 'refs/heads/main' && inputs.mode == 'full-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_REVISION: ${{ inputs.revision }}
      VALIDATION_REPORT: .cache-g1/full-validation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify exact source before dependency setup
        run: |
          python - <<'PY'
          import os,re,subprocess
          revision=os.environ['EXPECTED_REVISION']
          assert re.fullmatch(r'[0-9a-f]{40}',revision)
          for ref in ('HEAD','refs/remotes/origin/main'):
              assert subprocess.check_output(['git','rev-parse',ref],text=True).strip()==revision
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade --require-hashes --only-binary=:all: -r requirements-bootstrap.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: uv pip check --python "$(command -v python)"
      - name: Canonical full profile; never deploy
        run: python scripts/checks.py full --revision "$EXPECTED_REVISION" --report-directory "$VALIDATION_REPORT"
      - name: Preserve small results including failures and skipped cases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VALIDATION_REPORT }}/*.json
            ${{ env.VALIDATION_REPORT }}/*.xml
            ${{ env.VALIDATION_REPORT }}/*.log
            ${{ env.VALIDATION_REPORT }}/package/manifest.json
            ${{ env.VALIDATION_REPORT }}/package/bundle.sha256
          retention-days: 14
          if-no-files-found: warn

  group-publication:
    if: github.repository == 'Just9120/crypto-watcher' && github.ref == 'refs/heads/codex/interface-acceptance-20261030' && inputs.mode == 'group-publication' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASELINE: 04a894c95ff186c2983387eb74a93219670b17b0
      CANDIDATE: ${{ inputs.revision }}
      REPORT: .cache-g1/group-pair-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify immutable comparison sources and unchanged scenario
        run: |
          python - <<'PY'
          import hashlib,os,re,subprocess
          from pathlib import Path
          candidate,baseline=os.environ['CANDIDATE'],os.environ['BASELINE']
          assert re.fullmatch(r'[0-9a-f]{40}',candidate)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==candidate
          subprocess.run(['git','merge-base','--is-ancestor',baseline,candidate],check=True)
          for path in ('scripts/qualify_processing.py',
                       'tests/test_processing_replay.py','scripts/cpu_pair_budget.py',
                       'requirements.txt','requirements-dev.txt','Dockerfile'):
              assert subprocess.check_output(['git','show',baseline+':'+path])==Path(path).read_bytes(),path
          # Reviewed observation-only overlay is identical in both images.
          for path,digest in (
              ('tests/processing_replay.py','57068a1ce4fbf908e8d62f96f0c93f646d704b7980d90a4eb59e703ff17e9425'),
              ('tests/processing_observation.py','3d962dbe851cff28658db6b859a9dc1ecf640d58d34e4b94845b454730cb118f'),
          ):
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          PY
          mkdir -p .cache-g1/group-baseline .cache-g1/group-candidate
          git archive "$BASELINE" | tar -x -C .cache-g1/group-baseline
          git archive "$CANDIDATE" | tar -x -C .cache-g1/group-candidate
      - name: Check controller before the sole market pair
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          uv pip check --python "$(command -v python)"
          python -m pytest tests/test_group_pair.py tests/test_cpu_pair.py -q --basetemp .cache-g1/group-controller
      - name: Build both exact sources with the same clean controller
        run: |
          for label in baseline candidate; do
            if [ "$label" = baseline ]; then revision="$BASELINE"; else revision="$CANDIDATE"; fi
            context=".cache-g1/group-$label"
            docker build --build-arg SOURCE_REVISION="$revision" --build-arg BUILD_RUN="${{ github.run_id }}" -t "cw-group-base:$label" "$context"
            docker build -f "$context/tests/processing.Dockerfile" --build-arg BASE_IMAGE="cw-group-base:$label" -t "cw-group-runtime:$label" "$context"
            docker build -f tests/group_publication.Dockerfile --build-arg BASE_IMAGE="cw-group-runtime:$label" --build-arg MEASUREMENT_REVISION="$CANDIDATE" -t "cw-group-pair:$label" .
          done
      - name: One baseline-candidate pair within the shared budget
        run: |
          sudo timeout --signal=INT --kill-after=10s 600s "$(command -v python)" -B -m scripts.qualify_group_pair run cw-group-pair:baseline cw-group-pair:candidate "$CANDIDATE" "$GITHUB_WORKSPACE/$REPORT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: group-pair-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.REPORT }}/*.json
            ${{ env.REPORT }}/*.log
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  counter-delta-pair:
    if: github.repository == 'Just9120/crypto-watcher' && github.ref == 'refs/heads/codex/counter-delta-prototype-20261104' && inputs.mode == 'counter-delta-pair' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASELINE: 19e0051b3ed009c90d6badd93a75b14a6d097e6a
      CANDIDATE: ${{ inputs.revision }}
      REPORT: .cache-g1/counter-pair-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify counter-only experiment and exact original full scenario
        run: |
          python - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          source,baseline=os.environ['CANDIDATE'],os.environ['BASELINE']
          assert re.fullmatch(r'[0-9a-f]{40}',source)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          subprocess.run(['git','merge-base','--is-ancestor',baseline,source],check=True)
          assert not subprocess.check_output(['git','diff',baseline,source,'--','cryptowatcher'])
          for name in ('scripts/qualify_processing.py','scripts/qualify_cpu_pair.py',
                       'scripts/cpu_pair_budget.py','scripts/qualify_group_pair.py',
                       'tests/processing_replay.py','tests/processing_observation.py',
                       'tests/test_processing_replay.py','requirements.txt','requirements-dev.txt',
                       'requirements-bootstrap.txt','Dockerfile'):
              assert subprocess.check_output(['git','show',baseline+':'+name])==Path(name).read_bytes(),name
          PY
          mkdir -p "$REPORT"
      - name: Build one application tree and identical native harness with explicit modes
        run: |
          docker build --build-arg SOURCE_REVISION="$CANDIDATE" --build-arg BUILD_RUN="${{ github.run_id }}" -t cw-counter-base:common .
          docker build -f tests/counter_runtime.Dockerfile --build-arg BASE_IMAGE=cw-counter-base:common -t cw-counter-runtime:common .
          for label in baseline candidate; do
            if [ "$label" = baseline ]; then revision="$BASELINE"; flag=0; else revision="$CANDIDATE"; flag=1; fi
            docker build -f tests/counter_pair.Dockerfile --build-arg BASE_IMAGE=cw-counter-runtime:common --build-arg MEASUREMENT_REVISION="$CANDIDATE" --build-arg APPLICATION_REVISION="$revision" --build-arg COUNTER_DELTA="$flag" -t "cw-counter:$label" .
          done
      - name: Bounded Linux correctness before full comparison
        run: |
          sudo timeout --signal=INT --kill-after=10s 600s "$(command -v python)" -B -m scripts.qualify_counter_pair precheck cw-counter:candidate "$CANDIDATE" "$GITHUB_WORKSPACE/$REPORT/prechecks"
      - name: First full pair within original shared limits
        run: |
          sudo timeout --signal=INT --kill-after=10s 600s "$(command -v python)" -B -m scripts.qualify_counter_pair run cw-counter:baseline cw-counter:candidate "$CANDIDATE" "$GITHUB_WORKSPACE/$REPORT/pair-1"
      - name: Repeat unchanged pair on same host in reversed order
        run: |
          sudo timeout --signal=INT --kill-after=10s 600s "$(command -v python)" -B -m scripts.qualify_counter_pair run cw-counter:baseline cw-counter:candidate "$CANDIDATE" "$GITHUB_WORKSPACE/$REPORT/pair-2" --reverse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: counter-pairs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.REPORT }}/prechecks/*.json
            ${{ env.REPORT }}/prechecks/*.log
            ${{ env.REPORT }}/pair-1/*.json
            ${{ env.REPORT }}/pair-1/*.log
            ${{ env.REPORT }}/pair-2/*.json
            ${{ env.REPORT }}/pair-2/*.log
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
