name: PR validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.impact.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: impact
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: python scripts/impact.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python scripts/checks.py docs
  validation:
    needs: select
    if: needs.select.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: uv pip check --python "$(command -v python)"
      - run: python scripts/build_native.py
      - run: python scripts/checks.py all
      - env:
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          docker build --build-arg SOURCE_REVISION="$REVISION" --build-arg BUILD_RUN="$RUN_ID" -t "cryptowatcher:$REVISION" .
          python scripts/image_checks.py "cryptowatcher:$REVISION" "$REVISION"
          python scripts/package_release.py "$REVISION" "$RUN_ID" "cryptowatcher:$REVISION" .cache-g1/ci-release
  ci-required:
    needs: [select, documentation, validation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          SELECT: ${{ needs.select.result }}
          DOCUMENTATION: ${{ needs.documentation.result }}
          CODE: ${{ needs.select.outputs.code }}
          VALIDATION: ${{ needs.validation.result }}
        run: |
          test "$SELECT" = success
          test "$DOCUMENTATION" = success
          if [ "$CODE" = true ]; then
            test "$VALIDATION" = success
          else
            test "$CODE" = false
            test "$VALIDATION" = skipped
          fi
